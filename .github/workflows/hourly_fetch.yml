name: Hourly RSS Fetch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  fetch-rss:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run RSS Fetch Script
        run: python scripts/fetch_rss.py

      - name: Commit Updated Raw Articles
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/raw_articles.json

          git commit -m "Auto update RSS data" || echo "No changes to commit"

          git push
