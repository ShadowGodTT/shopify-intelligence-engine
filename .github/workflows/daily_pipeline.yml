name: Daily Shopify Intelligence Pipeline

on:
  schedule:
    # Runs every day at 9:00 AM UTC
    - cron: "0 9 * * *"

  workflow_dispatch:

jobs:
  shopify-intelligence:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run RSS Fetch Script
        run: |
          python scripts/fetch_rss.py

      - name: Run AI Analysis Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/analyze_articles.py

      - name: Write Events to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/write_to_sheets.py

      - name: Commit Updated JSON Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/raw_articles.json
          git add data/events.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily Shopify intelligence update"
            git push
          fi
